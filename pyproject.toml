[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier"
version = "0.1.0"
description = "Sort images into per-reference folders by identity (DINOv2 + optional TypeSafe Jev judge)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
image-classifier = "image_classifier.cli:app"

[tool.setuptools]
packages = ["image_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: sends real requests to TypeSafe Jev (needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"
